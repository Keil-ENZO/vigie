[project]
name = "vigie"
version = "0.1.0"
description = "Surveillance maritime locale : navires sur images Sentinel-2, caméra en direct, analyse par VLM."
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
  "ultralytics>=8.3.0",
  "torch>=2.4",
  "torchvision",
  "opencv-python-headless>=4.10",
  "pillow>=10",
  "numpy>=1.26",
  "rasterio>=1.4",
  "pyproj>=3.6",
  "shapely>=2.0",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "typer>=0.12",
  "rich>=13",
  "python-multipart>=0.0.9",
  "scipy>=1.17.1",
  "polars>=2.0.0",
]

[project.scripts]
vigie = "vigie.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigie"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
